apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: argocd-root
  namespace: argocd
spec:
  redirectRegex:
    regex: '^(https?://[^/]+)/(\?.*)?$'
    replacement: '${1}/argocd/${2}'
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-root
  namespace: argocd
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: argocd-argocd-root@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Exact
            backend:
              service:
                name: argocd-server-local
                port:
                  number: 80
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: argocd-slash
  namespace: argocd
spec:
  redirectRegex:
    regex: '^(https?://[^/]+/argocd)(\?.*)?$'
    replacement: '${1}/${2}'
    permanent: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-server-local
  namespace: argocd
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: argocd-argocd-slash@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /argocd
            pathType: Prefix
            backend:
              service:
                name: argocd-server-local
                port:
                  number: 80
