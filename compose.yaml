services:
  infra:
    build:
      context: .
      dockerfile: Dockerfile.infra
    working_dir: /workspace
    environment:
      KUBECONFIG: /workspace/.kubeconfig
      AI_LAN_CONFIG_DIR: /ai-lan-config
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      - .:/workspace
      - type: bind
        source: ../ai-lan-config
        target: /ai-lan-config
        read_only: true
        bind:
          create_host_path: false
      - /var/run/docker.sock:/var/run/docker.sock
