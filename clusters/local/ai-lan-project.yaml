apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: ai-lan
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  description: Hearth AI workloads, restricted to the ai-lan namespace.
  sourceRepos:
    - https://github.com/abellizzi1/ai-lan-config.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: ai-lan
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: Service
    - group: ""
      kind: PersistentVolumeClaim
    - group: apps
      kind: Deployment
    - group: networking.k8s.io
      kind: Ingress
