apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ai-lan
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  # No deletion finalizer: decommission workloads explicitly after backup.
spec:
  project: ai-lan
  source:
    repoURL: https://github.com/abellizzi1/ai-lan-config.git
    targetRevision: main
    path: overlays/ollama
  destination:
    server: https://kubernetes.default.svc
    namespace: ai-lan
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - PruneLast=true
      - FailOnSharedResource=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
